plugins {
    id 'com.android.application'
}

def buildNum = (project.findProperty('buildNumber') ?: '0').toString().toInteger()

android {
    namespace 'com.phonemedic.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.phonemedic.app"
        minSdk 24
        targetSdk 36
        // Numéro de build fourni par GitHub Actions : chaque compilation a un numéro plus grand
        versionCode 100 + buildNum
        versionName "1.4." + buildNum
    }

    buildFeatures {
        buildConfig true
    }

    // Deux versions du même code :
    //  - full : APK publiée sur GitHub, avec mise à jour intégrée, nettoyage par accessibilité et accès à tous les fichiers
    //  - play : version conforme au règlement Google Play, sans ces trois fonctions
    flavorDimensions = ['store']
    productFlavors {
        full {
            dimension 'store'
            buildConfigField 'boolean', 'STORE_PLAY', 'false'
        }
        play {
            dimension 'store'
            buildConfigField 'boolean', 'STORE_PLAY', 'true'
        }
    }

    signingConfigs {
        // Clé de debug fixe : chaque APK GitHub s'installe par-dessus la précédente
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Clé d'envoi Google Play : fournie par les secrets GitHub, jamais enregistrée dans le dépôt
        upload {
            def ks = System.getenv('UPLOAD_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig System.getenv('UPLOAD_KEYSTORE_PATH') ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phonemedic.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.phonemedic.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        // Clé de debug fixe : permet d'installer les nouvelles versions par-dessus l'ancienne
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

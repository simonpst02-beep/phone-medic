plugins {
    id 'com.android.application'
}

def buildNum = (project.findProperty('buildNumber') ?: '0').toString().toInteger()

android {
    namespace 'com.phonemedic.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.phonemedic.app"
        minSdk 24
        targetSdk 34
        // Numéro de build fourni par GitHub Actions : chaque compilation a un numéro plus grand
        versionCode 100 + buildNum
        versionName "1.3." + buildNum
    }

    signingConfigs {
        // Clé de debug fixe : permet d'installer les nouvelles versions par-dessus l'ancienne
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

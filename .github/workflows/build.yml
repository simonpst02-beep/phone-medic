name: Compiler l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhoneMedic.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMedic-apk
          path: PhoneMedic.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Phone Medic ${{ github.run_number }}
          body: Télécharge PhoneMedic.apk ci-dessous et ouvre-le sur ton téléphone pour l'installer.
          files: PhoneMedic.apk
          make_latest: true
